<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
</head>
<body>
<section class="container">
    <h1 class="text text-center text-info mt-2">ĐĂNG NHẬP NGƯỜI DÙNG</h1>

    <form method="post">
        <div class="form-floating mb-3 mt-3">
            <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập " name="uername">
            <label for="username">Tên đăng nhập</label>
        </div>

        <div class="form-floating mb-3 mt-3">
            <input type="text" class="form-control" id="password" placeholder="Mật khẩu " name="password">
            <label for="password">Mật khẩu</label>
        </div>

        <div class="form-floating mb-3 mt-3">
            <button class="btn btn-success">Đăng nhập</button>
        </div>
    </form>
</section>

</body>
</html>
